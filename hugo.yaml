baseURL: https://example.org/
languageCode: en-us
title: My New Hugo Site
theme: hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
    # allow KaTeX
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)'], ["$", "$"]]
        enable: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

params:
  math:
    engine: katex
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/DarthVeigar/georgerowlands.ch/edit/main/content"

menu:
  main:
    - name: Digital Garden
      pageRef: /garden
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://ch.linkedin.com/in/georgerowlands"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/imfing/hextra-starter-template"
      params:
        icon: github

