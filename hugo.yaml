baseURL: https://example.org/
languageCode: en-us
title: My New Hugo Site
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra


markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true
    # allow KaTeX
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)'], ["$", "$"]]
        enable: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

params:
  math:
    engine: katex

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/DarthVeigar/georgerowlands.ch/edit/main/content"

menu:
  main:
    - name: Digital Garden
      pageRef: /garden
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://ch.linkedin.com/in/georgerowlands"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/imfing/hextra-starter-template"
      params:
        icon: github

comments:
    enable: false
    type: giscus
    
    giscus:
      repo: DarthVeigar/georgerowlands.ch
      repoId: R_kgDOIt7MZQ
      category: Digital Garden Giscus
      categoryId: DIC_kwDOIt7MZc4ChZB7
      # strict: 0
      # reactionsEnabled: 1
      # emitMetadata: 0
      inputPosition: top
      theme: transparent_dark
      # lang: en
      loading: lazy